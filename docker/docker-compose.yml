version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: tilv-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_SITE_ADDRESS=${CADDY_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tilv-network
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:7
    container_name: tilv-mongodb
    # ports:  # Uncomment only for local dev; remove for production
    #   - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD required}
      MONGO_INITDB_DATABASE: tilv
    restart: unless-stopped
    networks:
      - tilv-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet -u ${MONGO_ROOT_USER:-admin} -p ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD required} --authenticationDatabase admin
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: tilv-redis
    # ports:  # Uncomment only for local dev; remove for production
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    restart: unless-stopped
    networks:
      - tilv-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-engine:
    build:
      context: ../ai-engine
      dockerfile: Dockerfile
    container_name: tilv-ai-engine
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_SHARED_SECRET=${AI_SHARED_SECRET:-tj4kQzH7pW3mN9vL2xR8cB5yF1gD6sA0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://localhost}
      - RPC_URL=${MANTLE_RPC_URL:-https://rpc.testnet.mantle.xyz}
      - AGENT_PRIVATE_KEY=${AGENT_PRIVATE_KEY:-}
      - AGENT_CONTROLLER=${AGENT_CONTROLLER:-}
      - VALIDATION_REGISTRY=${VALIDATION_REGISTRY:-}
      - POLL_INTERVAL=${POLL_INTERVAL:-3600}
      - MIN_YIELD_DELTA_BPS=${MIN_YIELD_DELTA_BPS:-50}
    volumes:
      - ../ai-engine:/app
    restart: unless-stopped
    networks:
      - tilv-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tilv-backend
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    environment:
      - DOCKER=true
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD required}@mongodb:27017/tilv?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - AI_SERVICE_URL=http://ai-engine:5000
      - AI_SHARED_SECRET=${AI_SHARED_SECRET:-tj4kQzH7pW3mN9vL2xR8cB5yF1gD6sA0}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://localhost}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      - MANTLE_RPC_URL=${MANTLE_RPC_URL:-https://rpc.testnet.mantle.xyz}
      - PRIVATE_KEY=${PRIVATE_KEY:-}
      - INVOICE_NFT_ADDRESS=${INVOICE_NFT_ADDRESS:-}
      - VAULT_MANAGER_ADDRESS=${VAULT_MANAGER_ADDRESS:-}
      - RISK_ENGINE_ADDRESS=${RISK_ENGINE_ADDRESS:-}
      - AGENT_CONTROLLER_ADDRESS=${AGENT_CONTROLLER_ADDRESS:-}
      - USDT_ADDRESS=${USDT_ADDRESS:-0x201EBa5CC46D216Ce6DC03F6a759e8E766e956aE}
    volumes:
      - ../backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    restart: unless-stopped
    networks:
      - tilv-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
        NEXT_PUBLIC_MANTLE_RPC: ${MANTLE_RPC_URL:-https://rpc.testnet.mantle.xyz}
        NEXT_PUBLIC_MANTLE_CHAIN_ID: ${MANTLE_CHAIN_ID:-5001}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        NEXT_PUBLIC_MAINNET: ${NEXT_PUBLIC_MAINNET:-false}
        NEXT_PUBLIC_VAULT_MANAGER_ADDRESS: ${VAULT_MANAGER_ADDRESS:-}
    container_name: tilv-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://localhost}
      - NEXT_PUBLIC_MANTLE_RPC=${MANTLE_RPC_URL:-https://rpc.testnet.mantle.xyz}
      - NEXT_PUBLIC_MANTLE_CHAIN_ID=${MANTLE_CHAIN_ID:-5001}
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
      - NEXT_PUBLIC_MAINNET=${NEXT_PUBLIC_MAINNET:-false}
      - NEXT_PUBLIC_VAULT_MANAGER_ADDRESS=${VAULT_MANAGER_ADDRESS:-}
    restart: unless-stopped
    networks:
      - tilv-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongo-express:
    image: mongo-express:latest
    container_name: tilv-mongo-express
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USER:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD required}
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:?MONGO_EXPRESS_PASSWORD required}
    restart: unless-stopped
    networks:
      - tilv-network
    profiles:
      - dev

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tilv-redis-commander
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOSTS=local:redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    restart: unless-stopped
    networks:
      - tilv-network
    profiles:
      - dev

volumes:
  caddy_data:
  caddy_config:
  mongodb_data:
  redis_data:
  backend_uploads:

networks:
  tilv-network:
    driver: bridge
