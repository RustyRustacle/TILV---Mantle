version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: tilv-mongodb
    # ports:  # Uncomment only for local dev; remove for production
    #   - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD required}
      MONGO_INITDB_DATABASE: tilv
    restart: unless-stopped
    networks:
      - tilv-network

  redis:
    image: redis:7-alpine
    container_name: tilv-redis
    # ports:  # Uncomment only for local dev; remove for production
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    restart: unless-stopped
    networks:
      - tilv-network

  ai-engine:
    build:
      context: ../ai-engine
      dockerfile: Dockerfile
    container_name: tilv-ai-engine
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - RPC_URL=${MANTLE_RPC_URL:-https://rpc.testnet.mantle.xyz}
      - AGENT_PRIVATE_KEY=${AGENT_PRIVATE_KEY:-}
      - AGENT_CONTROLLER=${AGENT_CONTROLLER:-}
      - VALIDATION_REGISTRY=${VALIDATION_REGISTRY:-}
    volumes:
      - ../ai-engine:/app:ro
    restart: unless-stopped
    networks:
      - tilv-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tilv-backend
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
      - redis
      - ai-engine
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD required}@mongodb:27017/tilv?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - AI_SERVICE_URL=http://ai-engine:5000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      - MANTLE_RPC_URL=${MANTLE_RPC_URL:-https://rpc.testnet.mantle.xyz}
    volumes:
      - ../backend:/app:ro
      - /app/node_modules
      - backend_uploads:/app/uploads
    restart: unless-stopped
    networks:
      - tilv-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: tilv-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      - NEXT_PUBLIC_MANTLE_RPC=${MANTLE_RPC_URL:-https://rpc.testnet.mantle.xyz}
      - NEXT_PUBLIC_MANTLE_CHAIN_ID=${MANTLE_CHAIN_ID:-5001}
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:?WALLETCONNECT_PROJECT_ID required}
      - NEXT_PUBLIC_MAINNET=${NEXT_PUBLIC_MAINNET:-false}
    restart: unless-stopped
    networks:
      - tilv-network

  mongo-express:
    image: mongo-express:latest
    container_name: tilv-mongo-express
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USER:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD required}
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:?MONGO_EXPRESS_PASSWORD required}
    restart: unless-stopped
    networks:
      - tilv-network
    profiles:
      - dev

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tilv-redis-commander
    ports:
      - "8082:8081"
    depends_on:
      - redis
    environment:
      - REDIS_HOSTS=local:redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    restart: unless-stopped
    networks:
      - tilv-network
    profiles:
      - dev

volumes:
  mongodb_data:
  redis_data:
  backend_uploads:

networks:
  tilv-network:
    driver: bridge
